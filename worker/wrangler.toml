name = "tubeplus"
main = "src/index.ts"
compatibility_date = "2026-11-09"

# Static assets are served from the edge without invoking the Worker or
# D1. /videos/index.html is the fast static snapshot of the catalog,
# regenerated by data/gen_static.py whenever new videos arrive.
[assets]
directory = "./assets"

[[d1_databases]]
binding = "DB"
database_name = "tubeplus-db"
database_id = "515b5d56-2556-4eae-bde9-061aca689163"
